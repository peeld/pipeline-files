[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "entitylayout"
version = "0.1.0"
description = "Ask for data by what it is, not where it lives: a storage-neutral entity layout layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100", "jsonschema>=4.20", "ruff>=0.6"]

[project.scripts]
entitylayout = "entitylayout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["entitylayout"]
known-local-folder = ["conftest", "strategies"]
